version: "3.9"

services:
  demo-ui:
    build: .
    command: streamlit run ui_streamlit.py --server.address=0.0.0.0 --server.port=8501
    ports:
      - "8501:8501"
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"

  demo-cli:
    build: .
    command: python main.py --source fixture --force
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
