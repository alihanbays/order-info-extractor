[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "order-info-extractor"
version = "1.0.0"
description = "A production-style order ingestion pipeline demo for mock Outlook messages."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "Alihan Baysal" }
]
dependencies = [
  "click>=8.1.7",
  "msal>=1.24.0",
  "openai>=1.3.0",
  "openpyxl>=3.1.2",
  "pdfplumber>=0.10.0",
  "pydantic>=2.5.0",
  "requests>=2.31.0",
  "streamlit>=1.28.0",
  "xlrd>=2.0.1"
]

[project.scripts]
order-info-extractor = "main:main"

[tool.setuptools.packages.find]
include = ["order_info_extractor*", "src*"]
